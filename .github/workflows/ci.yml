name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Run tests
        run: npm test

      - name: Check syntax
        run: npm run check

      - name: Validate prospective npm package
        run: npm run pack:check

      - name: Smoke test prospective packaged executable
        shell: bash
        run: |
          PACKAGE_TARBALL="$(npm pack --silent)"
          PACKAGE_PATH="$PWD/$PACKAGE_TARBALL"
          TEMP_DIR="$(mktemp -d)"
          cd "$TEMP_DIR"
          npm init -y >/dev/null 2>&1
          npm install "$PACKAGE_PATH" --no-audit --no-fund >/dev/null 2>&1
          set +e
          OUTPUT="$(timeout 2s ./node_modules/.bin/modelshortlist 2>&1)"
          STATUS=$?
          set -e
          echo "$OUTPUT"
          test "$STATUS" -eq 0 -o "$STATUS" -eq 124
          echo "$OUTPUT" | grep -q "ModelShortlist MCP server running on stdio"

      - name: Validate and smoke test published npm release
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          TEMP_DIR="$(mktemp -d)"
          cd "$TEMP_DIR"
          TARBALL="$(npm pack "@agentic.artists/modelshortlist@$VERSION" --silent)"
          tar -tf "$TARBALL" > package-files.txt
          grep -qx "package/package.json" package-files.txt
          grep -qx "package/bin/modelshortlist.js" package-files.txt
          grep -qx "package/mcp/server.js" package-files.txt
          grep -qx "package/lib/catalog.js" package-files.txt
          grep -qx "package/lib/openrouter.js" package-files.txt
          grep -qx "package/lib/artificial-analysis.js" package-files.txt
          grep -qx "package/config/aliases.json" package-files.txt
          ! grep -q '^package/website/' package-files.txt
          ! grep -q '^package/test/' package-files.txt
          ! grep -q '^package/.github/' package-files.txt
          ! grep -q '^package/.env.local$' package-files.txt
          npm init -y >/dev/null 2>&1
          npm install "./$TARBALL" --no-audit --no-fund >/dev/null 2>&1
          set +e
          OUTPUT="$(timeout 2s ./node_modules/.bin/modelshortlist 2>&1)"
          STATUS=$?
          set -e
          echo "$OUTPUT"
          test "$STATUS" -eq 0 -o "$STATUS" -eq 124
          echo "$OUTPUT" | grep -q "ModelShortlist MCP server running on stdio"

  windows-package:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Pack and smoke test prospective Windows executable
        shell: pwsh
        run: |
          $tarball = npm pack --silent
          $packagePath = Join-Path $PWD $tarball
          $tempDir = Join-Path $env:RUNNER_TEMP "modelshortlist-package-test"
          New-Item -ItemType Directory -Force -Path $tempDir | Out-Null
          Set-Location $tempDir
          npm init -y | Out-Null
          npm install $packagePath --no-audit --no-fund | Out-Null
          $output = cmd /c ".\node_modules\.bin\modelshortlist.cmd < NUL" 2>&1 | Out-String
          Write-Host $output
          if ($output -notmatch "ModelShortlist MCP server running on stdio") {
            throw "Prospective packaged Windows executable did not start correctly."
          }

      - name: Smoke test published Windows executable
        shell: pwsh
        run: |
          Set-Location $env:GITHUB_WORKSPACE
          $version = node -p "require('./package.json').version"
          $tempDir = Join-Path $env:RUNNER_TEMP "modelshortlist-published-test"
          New-Item -ItemType Directory -Force -Path $tempDir | Out-Null
          Set-Location $tempDir
          npm init -y | Out-Null
          npm install "@agentic.artists/modelshortlist@$version" --no-audit --no-fund | Out-Null
          $output = cmd /c ".\node_modules\.bin\modelshortlist.cmd < NUL" 2>&1 | Out-String
          Write-Host $output
          if ($output -notmatch "ModelShortlist MCP server running on stdio") {
            throw "Published Windows executable did not start correctly."
          }

  mcpb:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and validate MCPB bundle
        run: npm run mcpb:build

      - name: Upload MCPB bundle
        uses: actions/upload-artifact@v4
        with:
          name: modelshortlist-mcpb
          path: dist/*.mcpb
          if-no-files-found: error

  website:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: website
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install website dependencies
        run: npm install --no-audit --no-fund

      - name: Type-check website
        run: npm run check

      - name: Build website
        run: npm run build

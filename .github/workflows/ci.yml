name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Check syntax
        run: npm run check

      - name: Validate npm package
        run: npm run pack:check

      - name: Smoke test packaged executable
        shell: bash
        run: |
          PACKAGE_TARBALL="$(npm pack --silent)"
          PACKAGE_PATH="$PWD/$PACKAGE_TARBALL"
          TEMP_DIR="$(mktemp -d)"
          cd "$TEMP_DIR"
          npm init -y >/dev/null 2>&1
          npm install "$PACKAGE_PATH" >/dev/null 2>&1
          set +e
          OUTPUT="$(timeout 2s ./node_modules/.bin/openanalysis 2>&1)"
          STATUS=$?
          set -e
          echo "$OUTPUT"
          test "$STATUS" -eq 0 -o "$STATUS" -eq 124
          echo "$OUTPUT" | grep -q "OpenAnalysis MCP server running on stdio"

  windows-package:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Pack and smoke test Windows executable
        shell: pwsh
        run: |
          $tarball = npm pack --silent
          $packagePath = Join-Path $PWD $tarball
          $tempDir = Join-Path $env:RUNNER_TEMP "openanalysis-package-test"
          New-Item -ItemType Directory -Force -Path $tempDir | Out-Null
          Set-Location $tempDir
          npm init -y | Out-Null
          npm install $packagePath | Out-Null
          $output = cmd /c ".\node_modules\.bin\openanalysis.cmd < NUL" 2>&1 | Out-String
          Write-Host $output
          if ($output -notmatch "OpenAnalysis MCP server running on stdio") {
            throw "Packaged Windows executable did not start correctly."
          }

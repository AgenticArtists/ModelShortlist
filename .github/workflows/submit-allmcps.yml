name: Submit ModelShortlist to AllMCPs

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  submit:
    if: github.event.head_commit.message == 'Submit ModelShortlist to AllMCPs'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Submit repository to AllMCPs
        shell: bash
        run: |
          set -euo pipefail
          RESPONSE_FILE="$(mktemp)"
          HTTP_CODE="$(curl -sS -o "$RESPONSE_FILE" -w '%{http_code}' \
            -X POST 'https://allmcps.com/api/v1/submit' \
            -H 'Content-Type: application/json' \
            --data '{"name":"ModelShortlist","url":"https://github.com/AgenticArtists/ModelShortlist","description":"Local BYOK MCP for workload-specific AI model selection using current OpenRouter data and Artificial Analysis benchmarks.","category":"developer-tools","email":"agenticartists@gmail.com","tags":["model-selection","llm","openrouter","artificial-analysis","benchmarks","coding-agents","tool-calling","zdr","byok","open-source"],"license":"MIT","authType":"api_key","pricingModel":"byok","maintenanceStatus":"active","compatibleClients":["Claude Desktop","Claude Code","Cursor","Hermes Desktop","VS Code / Copilot"],"supportUrl":"https://github.com/AgenticArtists/ModelShortlist/issues"}')"
          cat "$RESPONSE_FILE"
          echo
          echo "HTTP $HTTP_CODE"
          test "$HTTP_CODE" -ge 200 -a "$HTTP_CODE" -lt 300
